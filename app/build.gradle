plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.android' }

// 正式签名从仓库根目录的 keystore.properties 读取（不入库）；缺失时 release 包不会签名，
// 发布脚本会明确报错，绝不自动退回 debug 签名。
def keystorePropsFile = rootProject.file('keystore.properties')
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystoreProps.load(new FileInputStream(keystorePropsFile))
}
def hasReleaseKeystore = keystoreProps.getProperty('storeFile')?.trim()

android {
 namespace 'com.ronnie.teslakey'
 compileSdk 34
 defaultConfig { applicationId 'com.ronnie.teslakey'; minSdk 31; targetSdk 34; versionCode 20261026; versionName '20261026' }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
 kotlinOptions { jvmTarget = '17' }
 signingConfigs {
  if (hasReleaseKeystore) {
   release {
    storeFile file(keystoreProps.getProperty('storeFile'))
    storePassword keystoreProps.getProperty('storePassword')
    keyAlias keystoreProps.getProperty('keyAlias')
    keyPassword keystoreProps.getProperty('keyPassword')
   }
  }
 }
 buildTypes { release { minifyEnabled false; if (hasReleaseKeystore) signingConfig signingConfigs.release } }
}
dependencies { implementation project(':protocol'); implementation 'androidx.core:core-ktx:1.13.1' }
